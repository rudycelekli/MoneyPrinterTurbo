name: Private MPT footage offset integration
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.13'
        lane:
        - baseline
        - candidate
    env:
      LANE: ${{ matrix.lane }}
      PYTHONUTF8: '1'
      PY_MINOR: ${{ matrix.python == '3.11' && '11' || '13' }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Stage bounded private payload first half in runner temp
      shell: python
      run: 'import os,pathlib

        pathlib.Path(os.environ[''RUNNER_TEMP''],''mpt-offset-payload.b64'').write_text('''')

        '
    - name: Exact frozen source and candidate materialization
      shell: python
      run: "import os,json,pathlib,base64,subprocess,hashlib\nimport zlib\npayload_path=pathlib.Path(os.environ['RUNNER_TEMP'],'mpt-offset-payload.b64')\n\
        payload_path.write_text(payload_path.read_text()+'')\n\
        p=json.loads(zlib.decompress(base64.b64decode(payload_path.read_text())))\n\
        subprocess.run(['git','fetch','--depth=1','https://github.com/harry0703/MoneyPrinterTurbo.git',p['main']],check=True)\n\
        subprocess.run(['git','config','core.autocrlf','false'],check=True)\nsubprocess.run(['git','checkout','--force','--detach','FETCH_HEAD'],check=True)\n\
        expected={f:hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest() for f\
        \ in subprocess.check_output(['git','ls-files','-z']).decode().split('\\0')\
        \ if f and pathlib.Path(f).is_file()}\nif os.environ['LANE']=='candidate':\n\
        \ path=pathlib.Path(os.environ['RUNNER_TEMP'],'candidate.patch');path.write_bytes(base64.b64decode(p['patch']));subprocess.run(['git','apply',str(path)],check=True);expected.update(p['files'])\n\
        else:\n for f,value in p['test_writes'].items():pathlib.Path(f).write_bytes(base64.b64decode(value));expected[f]=hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()\n\
        pathlib.Path(os.environ['RUNNER_TEMP'],'expected-source.json').write_text(json.dumps(expected))\n"
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: false
    - name: Frozen dependency sync
      shell: bash
      run: 'set -o pipefail

        uv sync --frozen --python "${{ matrix.python }}" 2>&1 | tee "$RUNNER_TEMP/install.log"'
    - name: Install native tools required by existing upstream CI
      shell: bash
      run: 'set -o pipefail

        sudo apt-get update 2>&1 | tee "$RUNNER_TEMP/apt-update.log"

        sudo apt-get install -y ffmpeg 2>&1 | tee "$RUNNER_TEMP/apt-ffmpeg.log"'
    - name: Native footage offset current caption codec cache controls
      shell: python
      run: "import os,subprocess,pathlib,json,hashlib,xml.etree.ElementTree as E\n\
        out=pathlib.Path(os.environ['RUNNER_TEMP']);lane=os.environ['LANE'];results={}\n\
        def run(name,args):\n r=subprocess.run(args,capture_output=True,text=True);(out/(name+'.log')).write_text(r.stdout+r.stderr);print(name,r.returncode,r.stdout[-1800:]);results[name]=r.returncode;return\
        \ r.returncode\nassert run('interpreter',['.venv/bin/python','-c','import\
        \ sys,json; print(json.dumps({\"executable\":sys.executable,\"version\":sys.version,\"\
        version_info\":list(sys.version_info)}))'])==0\nassert json.loads((out/'interpreter.log').read_text())['version_info'][:2]==[3,int(os.environ['PY_MINOR'])]\n\
        prefix=['.venv/bin/python','-m','pytest','-q']\nassert run('ffmpeg-version',['ffmpeg','-version'])==0\n\
        assert run('ffprobe-version',['ffprobe','-version'])==0\nregressions=['test/services/test_video_project.py']\n\
        tests=['test/services/test_video_project.py','test/services/test_minimax_output_container.py']\n\
        rc=run('tests',prefix+tests+['--junitxml='+str(out/'tests.xml')])\nroot=E.parse(out/'tests.xml').getroot();cases=list(root.iter('testcase'));failed=[x\
        \ for x in cases if x.find('failure') is not None];errors=[x for x in cases\
        \ if x.find('error') is not None]\nif lane=='baseline': assert rc==1 and len(failed)==8\
        \ and all('footage_start' in c.attrib.get('name','') for c in failed) and\
        \ not errors,[(x.attrib) for x in failed+errors]\nelse:\n assert rc==0,'candidate\
        \ project tests failed'\n assert all(c.find('skipped') is None for c in cases),\
        \ 'Native project coverage must not skip'\n paths=['app/services/video_project.py']+regressions\n\
        \ assert run('ruff-version',['.venv/bin/ruff','--version'])==0\n assert (out/'ruff-version.log').read_text().strip()=='ruff\
        \ 0.15.21'\n assert run('lint',['.venv/bin/ruff','check']+paths)==0\n assert\
        \ run('compile',['.venv/bin/python','-m','py_compile']+paths)==0\nexpected=json.loads((out/'expected-source.json').read_text());bad=[f\
        \ for f,h in expected.items() if not pathlib.Path(f).is_file() or hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()!=h]\n\
        (out/'source-guard.json').write_text(json.dumps({'all_tracked_exact':not bad,'mismatched':bad}));assert\
        \ not bad,bad\n(out/'results.json').write_text(json.dumps({'lane':lane,'commands':results,'cases':len(cases),'failures':len(failed),'errors':len(errors)}))\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mpt-offset-${{ matrix.python }}-${{ matrix.lane }}
        path: '${{ runner.temp }}/*.log

          ${{ runner.temp }}/*.json

          ${{ runner.temp }}/*.xml

          ${{ runner.temp }}/candidate.patch'
