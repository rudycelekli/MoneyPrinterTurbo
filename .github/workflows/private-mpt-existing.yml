name: Private MPT existing repair qualification
'on':
  workflow_dispatch: {}
  push:
    branches:
    - validation-mpt-existing-v3-20261021
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - lane: windows-main
          os: windows-latest
        - lane: windows-llm
          os: windows-latest
    env:
      LANE: ${{ matrix.lane }}
      PYTHONUTF8: '1'
    steps:
    - uses: actions/checkout@v4
    - name: Materialize exact private candidate
      shell: python
      run: "import os,json,pathlib,base64,subprocess,hashlib\npayload={'windows-main': {'ref': '90f77011d7e3b46d382e6d0180dabfb6725ffee4',\
        \ 'files': {}, 'patch': ''}, 'windows-llm': {'ref': '90f77011d7e3b46d382e6d0180dabfb6725ffee4', 'files': {'app/services/llm.py':\
        \ 'c649bd9753d37e99d49d281adc727de1cf3328751df907ce35cbc0f28c621b23', 'test/services/test_llm.py': '5c397c4379aa27f0a7315bcb50177934de7e7b6b7cef68a54e5e9d8063898aa1'},\
        \ 'patch': ''}}\n\
        p=payload[os.environ['LANE']]\nsubprocess.run(['git','fetch','--depth=1','https://github.com/harry0703/MoneyPrinterTurbo.git',p['ref']],check=True)\n\
        subprocess.run(['git','config','core.autocrlf','false'],check=True)\nsubprocess.run(['git','config','core.eol','lf'],check=True)\n\
        subprocess.run(['git','checkout','--force','--detach','FETCH_HEAD'],check=True)\nsubprocess.run(['git','checkout-index','--all','--force'],check=True)\n\
        expected={}\nfor f in subprocess.check_output(['git','ls-files','-z']).decode().split('\\0'):\n if f and pathlib.Path(f).is_file():expected[f]=hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()\n\
        if p['patch']:\n pathlib.Path(os.environ['RUNNER_TEMP'],'candidate.patch').write_bytes(base64.b64decode(p['patch']))\n\
        \ subprocess.run(['git','apply',str(pathlib.Path(os.environ['RUNNER_TEMP'],'candidate.patch'))],check=True)\nfor f,v\
        \ in p.get('write',{}).items():pathlib.Path(f).write_bytes(base64.b64decode(v))\nexpected.update(p['files'])\ndiagnostics={}\n\
        for f in ['app/services/llm.py','test/services/test_llm.py','test/services/test_material_cache.py','uv.lock']:\n b=pathlib.Path(f).read_bytes();diagnostics[f]={'sha256':hashlib.sha256(b).hexdigest(),'CRLF':b.count(bytes([13,10])),'LF':b.count(bytes([10]))}\n\
        pathlib.Path(os.environ['RUNNER_TEMP'],'materialization.json').write_text(json.dumps({'files':diagnostics,'core_eol':subprocess.check_output(['git','config','core.eol']).decode().strip(),'autocrlf':subprocess.check_output(['git','config','core.autocrlf']).decode().strip()}))\n\
        for f,v in p['files'].items():assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==v,f\npathlib.Path(os.environ['RUNNER_TEMP'],'expected-source.json').write_text(json.dumps(expected))\n"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Frozen dependency sync
      shell: bash
      run: 'set -o pipefail

        uv sync --frozen --python 3.11 2>&1 | tee "$RUNNER_TEMP/install.log"'
    - name: Bounded native qualification
      shell: python
      run: "import subprocess,os,pathlib,json,xml.etree.ElementTree as E,hashlib\nlane=os.environ['LANE'];out=pathlib.Path(os.environ['RUNNER_TEMP']);results={}\n\
        def run(name,args):\n p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,encoding='utf8',errors='replace');(out/(name+'.log')).write_text(p.stdout,encoding='utf8');print(name,p.returncode,p.stdout[-2500:]);results[name]=p.returncode;return\
        \ p.returncode\nprefix=['uv','run','--no-sync','python','-X','utf8','-m','pytest','-q']\nif lane.startswith('auth'):\n\
        \ tests=['test/services/test_api_authentication.py'] if lane=='auth-before' else ['test/services/test_api_authentication.py','test/services/test_controller_base.py','test/services/test_artifact_download_mime.py','test/services/test_artifact_http_head.py']\n\
        elif lane=='llm-after':tests=['test/services/test_llm.py','test/services/test_controller_llm.py','test/services/test_request_logging.py']\n\
        else:tests=['test/services/test_material_cache.py::TestMaterialSearchCache::test_corrupted_cache_is_removed_without_breaking_search']\n\
        rc=run('tests',prefix+tests+['--junitxml='+str(out/'tests.xml')])\nif lane=='auth-before':\n root=E.parse(out/'tests.xml').getroot();failed=[c\
        \ for c in root.iter('testcase') if c.find('failure') is not None];assert rc==1 and len(failed)==1 and failed[0].attrib['name'].startswith('test_latin1_and_utf8_encodings_preserve_existing_key_access'),[(c.attrib)\
        \ for c in failed]\nelif not lane.startswith('windows'):assert rc==0,'candidate tests failed'\nif lane=='windows-llm':\n\
        \ rc2=run('transport',prefix+['test/services/test_llm.py','-k','transport_limits_forwarded_to_gemini_and_litellm','--junitxml='+str(out/'transport.xml')]);assert\
        \ rc2==0\nif lane in ['auth-after','llm-after']:\n paths=['app/controllers/base.py','test/services/test_api_authentication.py']\
        \ if lane=='auth-after' else ['app/services/llm.py','test/services/test_llm.py']\n assert run('lint',['uv','run','--no-sync','ruff','check']+paths)==0\n\
        \ assert run('compile',['uv','run','--no-sync','python','-m','py_compile']+paths)==0\nexpected=json.loads((out/'expected-source.json').read_text());bad=[f\
        \ for f,h in expected.items() if not pathlib.Path(f).is_file() or hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()!=h]\n\
        (out/'source-guard.json').write_text(json.dumps({'all_tracked_exact':not bad,'mismatched':bad}));assert not bad,bad\n\
        (out/'results.json').write_text(json.dumps({'lane':lane,'commands':results,'scope':'Windows cache classification is\
        \ observation, never relabeled green when pytest fails'}))\nif lane.startswith('windows') and rc:raise SystemExit(rc)\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mpt-${{ matrix.lane }}
        path: '${{ runner.temp }}/*.log

          ${{ runner.temp }}/*.json

          ${{ runner.temp }}/*.xml

          ${{ runner.temp }}/candidate.patch'
