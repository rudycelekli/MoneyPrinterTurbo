name: Qualify MPT1691 review repair
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux-3-11:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
    - name: Canonical LF checkout configuration
      run: git config --global core.autocrlf false
      working-directory: ${{ github.workspace }}
    - name: Check out exact source head
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: harry0703/MoneyPrinterTurbo
        ref: cf75c6e520d86b50a559edc08fc8b927904c1d99
        path: source
        persist-credentials: false
    - name: Pinned Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Frozen upstream uv setup
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        enable-cache: true
    - name: Install exact upstream lock
      run: uv sync --frozen --python 3.11
    - name: Verify input and tests-only baseline identity
      run: python -c "import base64;exec(base64.b64decode(''))"
    - name: Meaningful exact baseline
      id: baseline
      run: 'set +e

        uv run --no-sync python -X utf8 -m pytest -vv --tb=long --junitxml="$RUNNER_TEMP/evidence/baseline.xml" test/services/test_material_cache.py::TestMaterialSearchCache::test_cleanup_preserves_cache_within_clock_granularity > "$RUNNER_TEMP/evidence/baseline.log" 2>&1

        status=$?

        set -e

        cat "$RUNNER_TEMP/evidence/baseline.log"

        python "$RUNNER_TEMP/evidence/baseline-validator.py" 1691 "$RUNNER_TEMP/evidence/baseline.xml" "$RUNNER_TEMP/evidence/baseline.log" "$status" > "$RUNNER_TEMP/evidence/baseline-result.json"

        '
    - name: Apply exact candidate and pretest identity
      id: candidate
      run: python -c "import base64;exec(base64.b64decode(''))"
    - name: Focused actual native candidate
      if: ${{ always() && steps.candidate.outcome == 'success' }}
      run: uv run --no-sync python -X utf8 -m pytest -vv --junitxml="$RUNNER_TEMP/evidence/focused.xml" test/services/test_material_cache.py::TestMaterialSearchCache::test_cleanup_preserves_cache_within_clock_granularity 2>&1 | tee "$RUNNER_TEMP/evidence/focused.log"
    - name: Compile all upstream Python sources
      if: ${{ always() && steps.candidate.outcome == 'success' }}
      run: uv run --no-sync python -m compileall app cli.py main.py webui test docs/skill
    - name: Full required Ruff
      if: ${{ always() && steps.candidate.outcome == 'success' }}
      run: uv run --no-sync ruff check app cli.py main.py webui test docs/skill
    - name: Full required unit suite
      if: ${{ always() && steps.candidate.outcome == 'success' }}
      run: uv run --no-sync python -X utf8 -m coverage run -m pytest -q test 2>&1 | tee "$RUNNER_TEMP/evidence/full-unit.log"
    - name: Install required native FFmpeg
      if: ${{ always() && steps.candidate.outcome == 'success' }}
      run: sudo apt-get update && sudo apt-get install -y ffmpeg
    - name: Native revision rendering
      if: ${{ always() && steps.candidate.outcome == 'success' }}
      run: uv run --no-sync python -X utf8 -m coverage run --append -m pytest -q test/services/test_video_project.py test/services/test_minimax_output_container.py 2>&1 | tee "$RUNNER_TEMP/evidence/native-render.log"
    - name: Required coverage threshold
      if: ${{ always() && steps.candidate.outcome == 'success' }}
      run: uv run --no-sync python -m coverage report 2>&1 | tee "$RUNNER_TEMP/evidence/coverage.log"
    - name: Final exact source identity
      if: ${{ always() && steps.candidate.outcome == 'success' }}
      run: python -c "import base64;exec(base64.b64decode(''))"
    - name: Upload actual diagnostics and receipts
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mpt-1691-linux-3.11
        path: ${{ runner.temp }}/evidence
        if-no-files-found: error
        retention-days: 14
    services:
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MPT_TEST_REDIS_HOST: 127.0.0.1
      MPT_TEST_REDIS_PORT: '6379'
      MPT_TEST_REDIS_DB: '15'
